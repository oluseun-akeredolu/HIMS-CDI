# HIMS-CDI Training Pipeline — Configuration (v9.3)
#
# These values are the ACTUAL configuration used by run_training.py.
# The script reads seeds from this file; all other values are defined in run_training.py
# and must be kept consistent with this file.

seeds:
  - 13
  - 37
  - 73
  - 101
  - 211
  - 421
  - 563
  - 719
  - 881
  - 997

n_seeds: 10

# Stratified case-bootstrap on ensemble-averaged probabilities
n_bootstrap_case_resamples: 10000  # NOT per-seed; this is case-bootstrap on 48 test cases
bootstrap_seed: 42

# Classification
classification_threshold: 0.50

# Stratified split (from the archive, seed 123)
split_seed: 123
train_size: 144
val_size: 48
test_size: 48

# Hyperparameters (these are the ACTUAL values used by the code, not the manuscript's original values)
hyperparameters:
  gcn_style_tabular:       # labeled as "GCN-style tabular baseline" (self-loop adjacency, effectively MLP)
    learning_rate: 1.0e-3
    hidden_units: 64
  transformer:
    learning_rate: 3.0e-5
    hidden_size: 128       # NOT 512 — 128 is what the code actually uses for CPU feasibility
  edge_aware_fusion:
    compression_ratio: 0.5
    learning_rate: 1.0e-3
  hims_cdi_mlr:
    C: 1.0
    platt_scaling: true
    platt_cv: 5

early_stopping:
  patience: 10  # epochs
  monitor: val_loss

measurement:
  warm_up_passes: 50
  timed_passes: 100
  metric: max_sampled_python_process_rss  # NOT memory_profiler peak; NOT end-to-end pipeline
  unit: batch  # predict_proba on all 48 cases at once, NOT single-case
