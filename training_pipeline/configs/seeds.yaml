# HIMS-CDI Training Pipeline — seed configuration
#
# The 10 seeds used for the model-training runs reported in Tables 5 and 7.
# These seeds come from supplementary_Material/Supplementary Material S4/S4_resource_usage.csv
# in the GitHub repository.
#
# Seeds are independent of the corpus-generation seeds (42) and the stratified
# split seed (123). They govern only the model-training runs.

seeds:
  - 13
  - 37
  - 73
  - 101
  - 211
  - 421
  - 563
  - 719
  - 881
  - 997

# Per-seed configuration
n_seeds: 10
n_bootstrap_resamples_per_seed: 10000  # 10,000 resamples per seed -> 100,000 total
bootstrap_seed: 42                      # RNG seed for the bootstrap resampling

# Stratified split (from the archive, seed 123)
split_seed: 123
train_size: 144
val_size: 48
test_size: 48

# Hyperparameters (from manuscript Table 4)
hyperparameters:
  gnn:
    learning_rate: 1.0e-3
    hidden_units: 64
  transformer:
    learning_rate: 3.0e-5
    hidden_size: 512
  edge_aware:
    compression_ratio: 0.5
  hims_cdi_mlr:
    C: 1.0                    # regularisation strength
    platt_scaling: true       # apply Platt scaling to MLR (HIMS-CDI_cal)
    platt_cv: 5               # 5-fold CV for Platt scaling

# Early stopping (for neural baselines)
early_stopping:
  patience: 10                # epochs
  monitor: val_loss

# Bootstrap pooling
pooling_method: rubin         # Rubin's rules (Rubin, 1987)
ci_method: percentile        # percentile method for 95% CIs
ci_level: 0.95

# Resource measurement (per S14 protocol)
measurement:
  warm_up_passes: 50
  timed_passes: 100
  peak_memory_metric: memory_profiler  # use memory_profiler for peak RAM
